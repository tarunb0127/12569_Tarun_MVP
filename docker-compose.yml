version: "3.9"

services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  photo-validator:
    build: .
    container_name: profile-photo-validator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434/api/generate
    volumes:
      - ./app/temp_uploads:/app/app/temp_uploads
    depends_on:
      - ollama

volumes:
  ollama_data: